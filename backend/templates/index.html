<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Analyse d’image pour accessibilité</title>
</head>
<body>
    <h1>Uploader une image à analyser</h1>
    <form method="post" enctype="multipart/form-data">
        <input type="file" name="image" accept="image/*" required>
        <button type="submit">Analyser l’image</button>
    </form>
</body>
</html>
